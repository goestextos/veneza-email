name: Scrape Veneza champion images

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/scrape-veneza-images.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install scraper dependency
        run: python -m pip install requests
      - name: Scrape official product images
        run: |
          python - <<'PY'
          import os, re, json, html, mimetypes
          from urllib.parse import urljoin, urlparse
          import requests

          products = {
            "aveia-flocos-fino-25kg": "https://distribuidoraveneza.com.br/aveia-flocos-fino-25kg-saca",
            "chia-3kg": "https://distribuidoraveneza.com.br/chia-3kg-pacote",
            "farelo-aveia-25kg": "https://distribuidoraveneza.com.br/farelo-de-aveia-25kg-saca",
            "semente-abobora-crua-2kg": "https://distribuidoraveneza.com.br/semente-de-abobora-scasca-crua-2-kg-pacote",
            "uva-passa-preta-10kg": "https://distribuidoraveneza.com.br/uva-passas-preta-argentina-10-kg-caixa",
            "cravo-flor-1kg": "https://distribuidoraveneza.com.br/cravo-flor-1-kg-pacote",
            "vinagre-maca-organico-12x400": "https://distribuidoraveneza.com.br/vinagre-de-maca-organico-12x400ml-caixa",
            "linhaca-dourada-5kg": "https://distribuidoraveneza.com.br/linhaca-dourada-5-kg-pacote",
            "maca-peruana-2kg": "https://distribuidoraveneza.com.br/maca-peruana-2-kg-pacote",
            "feno-grego-2kg": "https://distribuidoraveneza.com.br/feno-grego-po-2-kg-pacote",
            "farinha-amendoa-2kg": "https://distribuidoraveneza.com.br/farinha-de-amendoa-2-kg-pacote",
            "castanha-para-media-4kg": "https://distribuidoraveneza.com.br/castanha-do-para-media-pacote-4-kg",
          }

          outdir = "assets/email-2026-10-20-campeoes"
          os.makedirs(outdir, exist_ok=True)
          sess = requests.Session()
          sess.headers.update({"User-Agent":"Mozilla/5.0"})

          def fetch_page(page_url):
              r = sess.get(page_url, timeout=30)
              r.raise_for_status()
              return r.text

          def get_image_from_html(page_url, t):
              patterns = [
                  r'<meta[^>]+property=["\']og:image["\'][^>]+content=["\']([^"\']+)["\']',
                  r'<meta[^>]+content=["\']([^"\']+)["\'][^>]+property=["\']og:image["\']',
              ]
              for pat in patterns:
                  m = re.search(pat, t, flags=re.I)
                  if m:
                      return urljoin(page_url, html.unescape(m.group(1)))
              candidates = re.findall(r'(https?://imageswscdn\.wslojas\.com\.br/files/24534/[^"\'<> ]+)', t, flags=re.I)
              candidates = [html.unescape(x).replace("\\u0026","&") for x in candidates]
              bad = ("logo","favorit","frete","user","carrinho","forma","selo","banner","icone","icon")
              candidates = [x for x in candidates if not any(b in x.lower() for b in bad)]
              if candidates:
                  candidates.sort(key=lambda x: (("produto-" in x.lower()) or ("/med_" in x.lower()), len(x)), reverse=True)
                  return candidates[0]
              raise RuntimeError("No product image found")

          def get_price_from_html(t):
              # Prefer structured product offers.
              for m in re.finditer(r'<script[^>]+type=["\']application/ld\+json["\'][^>]*>(.*?)</script>', t, flags=re.I|re.S):
                  block = html.unescape(m.group(1))
                  try:
                      data = json.loads(block)
                  except Exception:
                      continue
                  stack = data if isinstance(data, list) else [data]
                  while stack:
                      obj = stack.pop(0)
                      if isinstance(obj, list):
                          stack.extend(obj)
                          continue
                      if not isinstance(obj, dict):
                          continue
                      typ = obj.get("@type")
                      if typ == "Product" or (isinstance(typ, list) and "Product" in typ):
                          offers = obj.get("offers")
                          if isinstance(offers, list) and offers:
                              offers = offers[0]
                          if isinstance(offers, dict):
                              val = offers.get("price") or offers.get("lowPrice")
                              if val is not None:
                                  try:
                                      return float(str(val).replace(",", "."))
                                  except Exception:
                                      pass
                      for v in obj.values():
                          if isinstance(v, (dict, list)):
                              stack.append(v)

              patterns = [
                  r'<meta[^>]+property=["\']product:price:amount["\'][^>]+content=["\']([^"\']+)["\']',
                  r'<meta[^>]+content=["\']([^"\']+)["\'][^>]+property=["\']product:price:amount["\']',
              ]
              for pat in patterns:
                  m = re.search(pat, t, flags=re.I)
                  if m:
                      try:
                          return float(m.group(1).replace(",", "."))
                      except Exception:
                          pass
              return None

          def brl(v):
              if v is None: return None
              s=f"{v:,.2f}".replace(",", "X").replace(".", ",").replace("X", ".")
              return "R$ " + s

          mapping={}
          for key,page in products.items():
              try:
                  t=fetch_page(page)
                  image_url=get_image_from_html(page, t)
                  price=get_price_from_html(t)
                  ir=sess.get(image_url,timeout=30)
                  ir.raise_for_status()
                  ctype=ir.headers.get("content-type","").split(";")[0].lower()
                  ext=mimetypes.guess_extension(ctype) or os.path.splitext(urlparse(image_url).path)[1] or ".jpg"
                  if ext==".jpe": ext=".jpg"
                  filename=key+ext
                  path=os.path.join(outdir,filename)
                  with open(path,"wb") as fh: fh.write(ir.content)
                  mapping[key]={"page":page,"source_image":image_url,"asset":path,"price":brl(price)}
                  print(key,"->",image_url,"price=",brl(price))
              except Exception as e:
                  mapping[key]={"page":page,"error":str(e)}
                  print("ERROR",key,e)

          with open(os.path.join(outdir,"images.json"),"w",encoding="utf-8") as fh:
              json.dump(mapping,fh,ensure_ascii=False,indent=2)
          PY
      - name: Commit images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/email-2026-10-20-campeoes
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Add official images for champion products"
            git push
          fi
